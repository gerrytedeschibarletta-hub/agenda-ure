<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda URE</title>
<meta name="description" content="Agenda condivisa della IV Sezione Ufficio Relazioni Esterne – Questura BAT">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1322" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda URE">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root{--bg:#f2f4f8;--ink:#15213a;--muted:#5a6680;--accent:#1c3d8c;color-scheme:light}
  @media (prefers-color-scheme: dark){:root{--bg:#0d1322;--ink:#e5e9f2;--muted:#97a2ba;--accent:#86a6ff;color-scheme:dark}}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top,0px);
    width:100%;height:calc(100% - env(safe-area-inset-top,0px));border:0;background:var(--bg)}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;padding:24px;text-align:center;background:var(--bg);z-index:5}
  .screen img{width:84px;height:84px;border-radius:20px}
  .screen b{font-size:20px}
  .screen span{color:var(--muted);font-size:15px;max-width:320px}
  .bar{width:120px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--accent) 20%,transparent);overflow:hidden}
  .bar::after{content:"";display:block;width:40%;height:100%;background:var(--accent);animation:run 1.1s ease-in-out infinite}
  @keyframes run{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
  @media (prefers-reduced-motion:reduce){.bar::after{animation:none;width:100%}}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 18px;background:var(--accent);color:var(--bg)}
  [hidden]{display:none!important}
</style>
</head>
<body>
  <div class="screen" id="loader">
    <img src="icons/icon-192.png" alt="">
    <b>Agenda Relazioni Esterne</b>
    <div class="bar"></div>
    <span>Caricamento dell'agenda…</span>
  </div>

  <div class="screen" id="offline" hidden>
    <img src="icons/icon-192.png" alt="">
    <b>Nessuna connessione</b>
    <span>L'agenda è salvata online: si aggiornerà appena il telefono torna connesso.</span>
    <button type="button" id="retry">Riprova</button>
  </div>

  <iframe id="app" title="Agenda Relazioni Esterne" allow="clipboard-write"></iframe>

  <script>
    /* Indirizzo della web app Apps Script (Esegui il deployment → URL dell'app web) */
    const APP_URL = 'https://script.google.com/macros/s/AKfycbyKTbENIFV5k7fTYoDq1XaPeI8ahIlpo8DVzr8c6WEQSxp0YMLID0rgzM9jlpYkyykh/exec';

    const frame = document.getElementById('app');
    const loader = document.getElementById('loader');
    const offline = document.getElementById('offline');
    let loaded = false;

    function load() {
      if (!navigator.onLine) { offline.hidden = false; loader.hidden = true; return; }
      offline.hidden = true; loader.hidden = false; loaded = false;
      frame.src = APP_URL;
    }
    frame.addEventListener('load', () => { if (frame.src) { loaded = true; loader.hidden = true; } });
    document.getElementById('retry').addEventListener('click', load);
    window.addEventListener('online', () => { if (!loaded || !offline.hidden) load(); });
    window.addEventListener('offline', () => { if (!loaded) { offline.hidden = false; loader.hidden = true; } });
    // se dopo 20 secondi non è ancora caricata, mostra il pulsante Riprova
    setTimeout(() => { if (!loaded) { loader.hidden = true; offline.hidden = false;
      offline.querySelector('b').textContent = 'Caricamento lento';
      offline.querySelector('span').textContent = 'L\'agenda non ha ancora risposto. Controlla la connessione e riprova.'; } }, 20000);

    load();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
